<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <title>tr('Elpris DK1')</title>
  <link rel="icon" type="image/svg+xml" href="resources/icon.svg" />
  <meta name="x-icue-property" content="showBackground" data-label="tr('Background')" data-type="switch" data-default="true">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    svg {
      display: block;
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
  </style>
</head>
<body>
<svg id="chart"></svg>

<script>
// ── Price constants (source: docs/elpris-spec.md) ────────────────────────────
const SURCHARGE  = 6.00;   // Gasel surcharge, øre/kWh excl. VAT
const ENERGINET  = 21.34;  // Energinet total (transport + system + TSO), øre/kWh excl. VAT
const DUTY       = 0.80;   // Electricity duty 2026–2027, øre/kWh excl. VAT
const VAT        = 1.25;
const FIXED      = 931.25 / 1900 * 100; // L-net net subscription amortised, øre/kWh incl. VAT (745 DKK excl. VAT/year × 1.25)

// L-net C-tariff (øre/kWh excl. VAT, valid from 1 July 2026)
function lNetTariff(hour, month) {
  const summer = month >= 4 && month <= 9;
  if (hour >= 17 && hour <= 20) return summer ? 20.82 : 48.05; // high-peak
  if (hour <= 5)                return 5.34;                    // off-peak
  return summer ? 8.01 : 16.02;                                 // peak
}

// Returns { spot, total } in DKK/kWh
// spot  = variable all-in (excl. fixed net subscription) — bottom bar segment
// total = all-in incl. fixed net subscription            — full bar height
function calcPrices(spotDkk, hour, month) {
  const spotOere = spotDkk * 100;
  const varExcl  = spotOere + SURCHARGE + lNetTariff(hour, month) + ENERGINET + DUTY;
  const varIncl  = varExcl * VAT;
  return {
    spot:  varIncl / 100,
    total: (varIncl + FIXED) / 100,
  };
}

// ── Colours (Warm Amber theme) ───────────────────────────────────────────────
const C = {
  fg:        '#f6efe8',
  fgMuted:   'rgba(246,239,232,0.45)',
  track:     'rgba(246,239,232,0.10)',
  working:   '#e5484d',
  grid:      'rgba(246,239,232,0.07)',
  bar:       '#b8542e',
  tariff:    '#e89668',
  current:   '#ffd166',
  curTariff: '#fff2c2',
  curStroke: '#ffe27a',
  curLabel:  '#ffe27a',
};

// ── SVG helpers ──────────────────────────────────────────────────────────────
const NS = 'http://www.w3.org/2000/svg';

function svgEl(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, String(v));
  return e;
}

function svgText(str, attrs) {
  const t = svgEl('text', attrs);
  t.textContent = str;
  return t;
}

// ── Tick calculation ─────────────────────────────────────────────────────────
function niceTicks(max, step) {
  const top = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = 0; v <= top + 1e-9; v = +(v + step).toFixed(2)) ticks.push(v);
  return { ticks, top };
}

// ── State ────────────────────────────────────────────────────────────────────
let lastHours = null;
let lastCurrentHour = 0;
let priceStatus = 'Henter priser…';
let bgOn = true;

let mode = 'price'; // 'price' | 'claude', toggled by clicking the widget
let claudeData = null;
let claudeStatus = 'Henter Claude-forbrug…';
let claudeWorking = false;
let claudeTimer = null;
let statusTimer = null;

function draw() {
  if (mode === 'claude') {
    if (claudeData) renderClaude(claudeData); else renderClaudeStatus();
  } else {
    if (lastHours) render(lastHours, lastCurrentHour); else showStatus(priceStatus);
  }
}

// ── Render: price chart ──────────────────────────────────────────────────────
function render(hours, currentHour) {
  const svg = document.getElementById('chart');
  const W = svg.clientWidth;
  const H = svg.clientHeight;
  if (!W || !H) return;

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  // Clear all children
  while (svg.firstChild) svg.removeChild(svg.firstChild);

  // Glow filter (only needed when background is on)
  if (bgOn) {
    const defs    = svgEl('defs');
    const filter  = svgEl('filter', { id: 'glow', x: '-50%', y: '-50%', width: '200%', height: '200%' });
    const blur    = svgEl('feGaussianBlur', { stdDeviation: Math.max(3, H * 0.019).toFixed(1), result: 'b' });
    const feMerge = svgEl('feMerge');
    feMerge.appendChild(svgEl('feMergeNode', { in: 'b' }));
    feMerge.appendChild(svgEl('feMergeNode', { in: 'SourceGraphic' }));
    filter.appendChild(blur);
    filter.appendChild(feMerge);
    defs.appendChild(filter);
    svg.appendChild(defs);
  }

  // Layout
  const padTop    = Math.round(H * 0.089);
  const padRight  = Math.round(W * 0.031);
  const padBottom = Math.round(H * 0.111);
  // padLeft must accommodate Y-axis labels ("1,75 kr." ≈ 5× fsLabel wide) plus gap
  const fsLabelEst = Math.max(11, Math.round(H * 0.030));
  const padLeft   = Math.max(Math.round(fsLabelEst * 5.2), Math.round(W * 0.070));
  const plotW     = W - padLeft - padRight;
  const plotH     = H - padTop - padBottom;
  const barGap    = Math.max(2, Math.round(W * 0.007));
  const barW      = (plotW - barGap * 23) / 24;
  const r         = Math.min(barW / 2, Math.max(3, H * 0.014));
  const glowPad   = Math.max(2, Math.round(H * 0.008));
  const stroke    = Math.max(1, H * 0.003);

  // Font sizes
  const fsLabel = Math.max(11, Math.round(H * 0.030));
  const fsHour  = Math.max(11, Math.round(H * 0.033));

  const maxVal = Math.max(...hours.map(h => h.total));
  const { ticks, top } = niceTicks(maxVal, 0.25);

  const yFor = v => padTop + (1 - v / top) * plotH;

  // Y-axis grid lines and tick labels
  const tickGap = Math.max(8, Math.round(W * 0.009));
  for (let i = 0; i < ticks.length; i++) {
    const t = ticks[i];
    const y = yFor(t);
    if (bgOn) {
      svg.appendChild(svgEl('line', {
        x1: padLeft, x2: W - padRight,
        y1: y,       y2: y,
        stroke: C.grid,
        'stroke-width': 1,
        'stroke-dasharray': i === 0 ? '0' : '2 6',
      }));
    }
    svg.appendChild(svgText(t.toFixed(2).replace('.', ',') + ' kr.', {
      x: padLeft - tickGap,
      y,
      'text-anchor': 'end',
      'dominant-baseline': 'central',
      'font-size': fsLabel,
      'font-weight': 500,
      fill: C.fgMuted,
    }));
  }

  // Hour bars
  const hourLabelY = H - padBottom + Math.round(padBottom * 0.42);

  for (let i = 0; i < 24; i++) {
    const h = hours[i];
    const isNow  = h.hour === currentHour;
    const x      = padLeft + i * (barW + barGap);
    const totalY = yFor(h.total);
    const spotY  = yFor(h.spot);
    const totalH = H - padBottom - totalY;
    const spotH  = H - padBottom - spotY;
    const cx     = x + barW / 2;

    const g = svgEl('g');

    // Glow halo (animated, current hour only, only with background)
    if (isNow && bgOn) {
      const halo = svgEl('rect', {
        x: x - glowPad,
        y: totalY - glowPad,
        width:  barW + glowPad * 2,
        height: totalH + glowPad * 2,
        rx: r + glowPad,
        fill: C.current,
        opacity: 0.55,
        filter: 'url(#glow)',
      });
      const anim = svgEl('animate', {
        attributeName: 'opacity',
        values: '0.25;0.75;0.25',
        dur: '2.2s',
        repeatCount: 'indefinite',
      });
      halo.appendChild(anim);
      g.appendChild(halo);
    }

    // Variable portion (bottom bar segment — spot + tariffs + duty)
    g.appendChild(svgEl('rect', {
      x, y: spotY,
      width: barW, height: spotH,
      rx: r,
      fill: isNow ? C.current : C.bar,
    }));

    // Fixed network subscription cap (top segment, constant 49.01 øre/kWh)
    if (h.total > h.spot) {
      g.appendChild(svgEl('rect', {
        x, y: totalY,
        width: barW, height: spotY - totalY + r,
        rx: r,
        fill: isNow ? C.curTariff : C.tariff,
      }));
    }

    // Current-hour outline
    if (isNow) {
      g.appendChild(svgEl('rect', {
        x: x - stroke * 0.75,
        y: totalY - stroke * 0.75,
        width:  barW + stroke * 1.5,
        height: totalH + stroke * 1.5,
        rx: r + stroke * 0.75,
        fill: 'none',
        stroke: C.curStroke,
        'stroke-width': stroke,
        opacity: 0.9,
      }));
    }

    // X-axis hour label
    g.appendChild(svgText(String(h.hour).padStart(2, '0'), {
      x: cx, y: hourLabelY,
      'text-anchor': 'middle',
      'dominant-baseline': 'central',
      'font-size': fsHour,
      'font-weight': isNow ? 800 : 500,
      fill: isNow ? C.curLabel : C.fgMuted,
    }));

    svg.appendChild(g);
  }
}

// ── Render: Claude usage gauges ──────────────────────────────────────────────
const GAUGE_START = 135; // degrees clockwise from 3 o'clock; 270° sweep leaves the gap at the bottom
const GAUGE_SWEEP = 270;

function arcPath(cx, cy, r, a0, a1) {
  const pt = a => `${cx + r * Math.cos(a * Math.PI / 180)} ${cy + r * Math.sin(a * Math.PI / 180)}`;
  return `M ${pt(a0)} A ${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${pt(a1)}`;
}

function gauge(svg, cx, cy, R, percent, label, caption, fsCaption) {
  const sw = R * 0.16;
  const p  = Math.min(100, Math.max(0, percent));

  svg.appendChild(svgEl('path', {
    d: arcPath(cx, cy, R, GAUGE_START, GAUGE_START + GAUGE_SWEEP),
    fill: 'none', stroke: C.track, 'stroke-width': sw, 'stroke-linecap': 'round',
  }));
  if (p > 0) {
    svg.appendChild(svgEl('path', {
      d: arcPath(cx, cy, R, GAUGE_START, GAUGE_START + GAUGE_SWEEP * p / 100),
      fill: 'none', stroke: C.tariff, 'stroke-width': sw, 'stroke-linecap': 'round',
    }));
  }

  svg.appendChild(svgText(Math.round(percent) + '%', {
    x: cx, y: cy, 'text-anchor': 'middle', 'dominant-baseline': 'central',
    'font-size': Math.round(R * 0.45), 'font-weight': 700, fill: C.fg,
  }));
  svg.appendChild(svgText(label, {
    x: cx, y: cy + R * 0.38, 'text-anchor': 'middle', 'dominant-baseline': 'central',
    'font-size': Math.max(11, Math.round(R * 0.15)), 'font-weight': 500, fill: C.fgMuted,
  }));
  svg.appendChild(svgText(caption, {
    x: cx, y: cy + R * 1.02, 'text-anchor': 'middle', 'dominant-baseline': 'central',
    'font-size': fsCaption, 'font-weight': 500, fill: C.fgMuted,
  }));
}

function spinner(svg, cx, cy, r) {
  const sw = r * 0.28;
  svg.appendChild(svgEl('circle', { cx, cy, r, fill: 'none', stroke: C.track, 'stroke-width': sw }));
  const arc = svgEl('path', {
    d: arcPath(cx, cy, r, 0, 100),
    fill: 'none', stroke: C.working, 'stroke-width': sw, 'stroke-linecap': 'round',
  });
  arc.appendChild(svgEl('animateTransform', {
    attributeName: 'transform', type: 'rotate',
    from: `0 ${cx} ${cy}`, to: `360 ${cx} ${cy}`, dur: '1s', repeatCount: 'indefinite',
  }));
  svg.appendChild(arc);
}

function renderClaude(data) {
  const svg = document.getElementById('chart');
  const W = svg.clientWidth;
  const H = svg.clientHeight;
  if (!W || !H) return;

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  while (svg.firstChild) svg.removeChild(svg.firstChild);

  const R         = Math.min(W * 0.17, H * 0.36);
  const cy        = H * 0.45;
  const fsCaption = Math.max(12, Math.round(H * 0.045));
  const dayTime   = { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' };
  const fmt       = d => new Date(d).toLocaleString('da-DK', dayTime);

  gauge(svg, W * 0.27, cy, R, data.session.percent, 'Session', fmt(data.fetchedAt), fsCaption);
  gauge(svg, W * 0.73, cy, R, data.weekly.percent, 'Uge', 'Nulstilles ' + fmt(data.weekly.resetsAt), fsCaption);
  if (claudeWorking) spinner(svg, W / 2, cy, R * 0.22);
}

// Error/loading text, with the spinner above it so "Claude is working" still shows without usage data.
function renderClaudeStatus() {
  showStatus(claudeStatus);
  if (!claudeWorking) return;
  const svg = document.getElementById('chart');
  const W = svg.clientWidth || 840;
  const H = svg.clientHeight || 344;
  spinner(svg, W / 2, H * 0.3, Math.min(W * 0.17, H * 0.36) * 0.22);
}

function showStatus(msg) {
  const svg = document.getElementById('chart');
  const W = svg.clientWidth || 840;
  const H = svg.clientHeight || 344;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  svg.appendChild(svgText(msg, {
    x: W / 2, y: H / 2,
    'text-anchor': 'middle',
    'dominant-baseline': 'central',
    'font-size': Math.max(14, Math.round(H * 0.050)),
    'font-weight': 400,
    fill: 'rgba(246,239,232,0.45)',
  }));
}

// ── Hourly tick (moves the current-hour marker without re-fetching) ──────────
function scheduleHourTick() {
  const now = new Date();
  const msToNextHour = (60 - now.getMinutes()) * 60000
                     - now.getSeconds() * 1000
                     - now.getMilliseconds();
  setTimeout(() => {
    lastCurrentHour = new Date().getHours();
    draw();
    scheduleHourTick();
  }, msToNextHour);
}

// ── Data fetching ─────────────────────────────────────────────────────────────
async function fetchDay(date) {
  const y  = date.getFullYear();
  const m  = String(date.getMonth() + 1).padStart(2, '0');
  const d  = String(date.getDate()).padStart(2, '0');
  const r  = await fetch(`https://www.elprisenligenu.dk/api/v1/prices/${y}/${m}-${d}_DK1.json`);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

const PRICE_RETRY_MS = 5 * 60000;

async function init() {
  priceStatus = 'Henter priser…';
  draw();

  const now         = new Date();
  const month       = now.getMonth() + 1;
  const currentHour = now.getHours();

  try {
    const raw   = await fetchDay(now);
    const hours = raw.map(entry => {
      // Parse timestamp properly so UTC offset is respected regardless of CET/CEST
      const hour = new Date(entry.time_start).getHours();
      return { hour, ...calcPrices(entry.DKK_per_kWh, hour, month) };
    }).sort((a, b) => a.hour - b.hour);

    lastHours       = hours;
    lastCurrentHour = currentHour;
    draw();

    const midnight = new Date(now);
    midnight.setHours(24, 0, 30, 0); // 30s after midnight avoids edge races
    setTimeout(init, midnight - now);

  } catch (e) {
    lastHours   = null;
    priceStatus = 'Priser ikke tilgængelige – ' + (e && (e.message || String(e)));
    draw();
    setTimeout(init, PRICE_RETRY_MS);
  }
}

// ── Claude mode ───────────────────────────────────────────────────────────────
// Served by helper/claude-usage-server.ps1; only polled while Claude mode is visible.
const CLAUDE_HELPER = 'http://127.0.0.1:47821';

async function fetchClaude() {
  try {
    const r    = await fetch(`${CLAUDE_HELPER}/usage`);
    const body = await r.json();
    if (r.status === 401) throw new Error('Åbn Claude Code for at forny login');
    if (r.status === 429) throw new Error('Anthropic begrænser forespørgsler – prøver igen kl. ' +
      new Date(body.retryAt).toLocaleTimeString('da-DK', { hour: '2-digit', minute: '2-digit' }));
    if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
    claudeData = body;
  } catch (e) {
    claudeData   = null;
    claudeStatus = 'Claude-forbrug ikke tilgængeligt – ' + e.message;
  }
  if (mode === 'claude') draw();
}

// Set by Claude Code hooks via the helper. If the helper is unreachable the usage
// poll already shows the error, so the spinner simply stays off.
async function fetchClaudeStatus() {
  let working = false;
  try {
    const r = await fetch(`${CLAUDE_HELPER}/status`);
    working = r.ok && (await r.json()).working;
  } catch (e) {}
  if (working === claudeWorking) return; // redraw only on change so the spinner doesn't restart
  claudeWorking = working;
  if (mode === 'claude') draw();
}

function toggleMode() {
  mode = mode === 'price' ? 'claude' : 'price';
  clearInterval(claudeTimer);
  clearInterval(statusTimer);
  if (mode === 'claude') {
    fetchClaude();
    fetchClaudeStatus();
    claudeTimer = setInterval(fetchClaude, 60000);
    statusTimer = setInterval(fetchClaudeStatus, 2000);
  }
  draw();
}

document.addEventListener('click', toggleMode);

// ── Resize observer and hourly tick ───────────────────────────────────────────
new ResizeObserver(draw).observe(document.getElementById('chart'));
scheduleHourTick();

// ── iCUE wiring ───────────────────────────────────────────────────────────────
// iCUE may inject properties into a sandboxed scope rather than window directly
function getIcueProperty(name) {
  if (typeof window !== 'undefined' && Object.prototype.hasOwnProperty.call(window, name)) {
    const value = window[name];
    if (value !== undefined && value !== null && value !== '') return value;
  }
  try {
    return Function('return typeof ' + name + ' !== "undefined" ? ' + name + ' : undefined')();
  } catch (e) {}
  return undefined;
}

function applyBackground() {
  const val = getIcueProperty('showBackground');
  bgOn = val === undefined ? true : val;

  document.documentElement.style.background = bgOn ? '#0e0a08' : '';
  document.body.style.backgroundImage = bgOn
    ? 'radial-gradient(ellipse 80% 60% at 30% 120%, rgba(217,119,87,0.18), transparent 60%),' +
      'radial-gradient(ellipse 70% 50% at 80% -20%, rgba(217,119,87,0.10), transparent 60%)'
    : '';

  draw();
}

icueEvents = { onICUEInitialized: init, onDataUpdated: applyBackground };

// Run directly in browser (no iCUE runtime present) or if already initialised
if (typeof iCUE_initialized === 'undefined' || iCUE_initialized) {
  init();
  applyBackground();
}
</script>
</body>
</html>
